site_name: abb_robot_client
site_description: Python client library for ABB robots using RWS and EGM
site_url: https://abb-robot-client.readthedocs.io
repo_url: https://github.com/johnwason/abb_robot_client
repo_name: johnwason/abb_robot_client

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.expand
    - search.highlight
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            members_order: source
            show_root_heading: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - toc:
      permalink: true

nav:
  - Home: index.md
  - API Reference:
      - api/index.md
      - RWS: api/rws.md
      - RWS AsyncIO: api/rws_aio.md
      - EGM: api/egm.md
